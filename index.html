<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HandyMate</title>
  <script type="module" crossorigin src="./assets/index-DxFFfMgp.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DKAP_0Vg.css">
</head>
<body>
<svg class="library" width="0" height="0" aria-hidden="true">
  <!-- The shop's and the feature cards' pictures, in the plan's pencil (DESIGN.md «Shapes»); the cable in marker. -->
  <symbol id="art-hammer" viewBox="0 0 120 60">
    <g class="pencil">
      <path class="bit" d="M3 26 H37" />
      <path class="flute" d="M9 23.6 l3 4.8 M16 23.6 l3 4.8 M23 23.6 l3 4.8 M30 23.6 l3 4.8" />
      <rect x="36" y="20" width="10" height="12" rx="2" />
      <rect x="40" y="31" width="8" height="21" rx="3" />
      <path d="M46 14 H92 Q99 14 99 21 V31 Q99 38 92 38 H53 Q46 38 46 31 Z" />
      <path d="M92 14 H106 Q114 14 114 22 V48 Q114 56 106 56 H98 Q92 56 92 50 V38" />
      <rect class="grip" x="99" y="22" width="8" height="26" rx="3.5" />
      <path class="vent" d="M62 19 V26 M67 19 V26 M72 19 V26 M77 19 V26" />
      <path class="cord" d="M108 56 q2 3 8 3" />
    </g>
  </symbol>
  <symbol id="art-hole" viewBox="0 0 120 50">
    <rect class="wall" x="52" y="0" width="16" height="50" />
    <rect class="bore" x="52" y="18" width="16" height="14" />
    <path class="cable" d="M16 25 H104" />
    <g class="dev"><circle cx="16" cy="25" r="6.4" /><path d="M13.6 22 V28 M18.4 22 V28" /></g>
    <g class="dev"><circle cx="104" cy="25" r="6.4" /><path d="M101.6 22 V28 M106.4 22 V28" /></g>
  </symbol>
  <!-- Step 3's card (tasks/U/03): the kettle on a line whose breaker tag goes red, its slots spilling over. -->
  <symbol id="art-load" viewBox="0 0 132 64">
    <g class="pencil">
      <path d="M8 54 H40 L35 22 H13 Z" />
      <path class="spout" d="M37 34 L46 25" />
      <path class="handle" d="M13 28 Q3 31 6 42 Q8 48 11 48" />
      <path d="M19 22 Q24 15 29 22" />
      <rect x="21" y="14" width="6" height="3.4" rx="1.4" />
    </g>
    <path class="cable" d="M40 46 H58" />
    <g class="tag">
      <rect class="label" x="58" y="18" width="58" height="38" rx="3" />
      <text x="64" y="31">16 A</text>
      <g class="full">
        <rect x="64" y="38" width="4.6" height="7" rx="1" /><rect x="70" y="38" width="4.6" height="7" rx="1" />
        <rect x="76" y="38" width="4.6" height="7" rx="1" /><rect x="82" y="38" width="4.6" height="7" rx="1" />
        <rect x="88" y="38" width="4.6" height="7" rx="1" /><rect x="94" y="38" width="4.6" height="7" rx="1" />
        <rect x="100" y="38" width="4.6" height="7" rx="1" /><rect x="106" y="38" width="4.6" height="7" rx="1" />
      </g>
      <g class="spill"><rect x="114" y="38" width="4.6" height="7" rx="1" /><rect x="121" y="38" width="4.6" height="7" rx="1" /></g>
    </g>
  </symbol>
  <!-- Step 4's card (tasks/U/04): under the client's eye, an open cable her highlighter marks against one in a channel. -->
  <symbol id="art-wish" viewBox="0 0 132 76">
    <g class="pencil eye"><path d="M48 14 Q66 -4 84 14 Q66 32 48 14 Z" /><circle cx="66" cy="14" r="5.6" /><circle class="pupil" cx="66" cy="14" r="2.4" /></g>
    <rect class="wall" x="2" y="40" width="128" height="9" />
    <path class="mark" d="M14 54 H58" />
    <path class="open" d="M14 54 H58" />
    <rect class="duct" x="72" y="50.6" width="48" height="6.8" />
    <path class="cable" d="M74 54 H118" />
    <g class="dev"><circle cx="12" cy="54" r="6.4" /><path d="M9.6 51 V57 M14.4 51 V57" /></g>
    <g class="dev"><circle cx="120" cy="54" r="6.4" /><path d="M117.6 51 V57 M122.4 51 V57" /></g>
  </symbol>
  <!-- Step 5 (tasks/U/05): the wall chaser — its twin-disc guard, the motor, the top handle, the rear grip — and what it
       does: a cable run along a wall's face, faded into the fresh plaster of its groove, as the plan draws a chase. -->
  <symbol id="art-chaser" viewBox="0 0 120 60">
    <g class="pencil">
      <path d="M8 46 A22 22 0 1 1 52 46 Z" />
      <path class="blade" d="M14 46 A16 16 0 0 1 46 46 M19 46 A11 11 0 0 1 41 46" />
      <path class="bed" d="M4 46 H56" />
      <path d="M50 22 H94 Q101 22 101 29 V39 Q101 46 94 46 H50 Z" />
      <path d="M62 22 V13 Q62 8 67 8 H83 Q88 8 88 13 V22" />
      <rect class="grip" x="101" y="27" width="13" height="16" rx="4" />
      <path class="vent" d="M70 28 V40 M75 28 V40 M80 28 V40" />
      <path class="cord" d="M114 39 q4 3 4 9" />
    </g>
  </symbol>
  <symbol id="art-chase" viewBox="0 0 120 50">
    <rect class="wall" x="0" y="4" width="120" height="20" />
    <path class="plaster" d="M18 24 H102" />
    <path class="cable" d="M18 24 H102" />
    <g class="dev"><circle cx="12" cy="24" r="6.4" /><path d="M9.6 21 V27 M14.4 21 V27" /></g>
    <g class="dev"><circle cx="108" cy="24" r="6.4" /><path d="M105.6 21 V27 M110.4 21 V27" /></g>
  </symbol>
  <!-- Step 6 (tasks/U/06): lights on their own line — from the panel one chase carrying two cables, the sockets' line to
       a socket and the lamp's own thinner one on beside it to the wall light, as the plan draws them. -->
  <symbol id="art-lights" viewBox="0 0 132 38">
    <rect class="wall" x="0" y="2" width="132" height="22" />
    <path class="plaster" d="M14 24 H124" />
    <path class="cable" d="M22 19 H84" />
    <path class="lamp" d="M22 29 H118" />
    <g class="box"><rect x="4" y="16" width="16" height="16" rx="2.4" /><path d="M13.4 18.6 L8.6 25 H12 L10.6 29.6 L15.6 23 H12.2 Z" /></g>
    <g class="dev"><circle cx="90" cy="19" r="6" /><path d="M87.8 16.2 V21.8 M92.2 16.2 V21.8" /></g>
    <g class="dev"><circle cx="124" cy="29" r="6" /><path d="M121.2 29.7 A2.8 2.8 0 0 1 126.8 29.7 Z M124 29.7 V32" /></g>
  </symbol>
</svg>
<div id="phone">
  <div id="sheet">
    <section id="title" class="screen" hidden>
      <h1 class="brand">HandyMate<svg class="underline" viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true"><path d="M2 5.2 C 20 3.4, 41 6.1, 60 4.4 S 90 3.2, 98 4.6" /></svg></h1>
      <svg class="doodle" viewBox="0 0 60 34" aria-hidden="true">
        <path class="wall" d="M0 0 H60 V4 H4 V34 H0 Z" />
        <path class="cable" d="M8 26 V8 H48" />
        <g class="dev"><circle cx="8" cy="26" r="3.2" /><path d="M6.9 24.7 V27.3 M9.1 24.7 V27.3" /></g>
        <g class="dev"><circle cx="48" cy="8" r="3.2" /><path d="M46.6 6.6 L49.4 9.4 M49.4 6.6 L46.6 9.4" /></g>
        <path class="tick" d="M50.5 3.6 l1.3 1.4 l2.7 -3.2" />
      </svg>
      <button id="start" class="ptag start" type="button"><b id="startLabel"></b><small id="startNote"></small></button>
      <button id="toShop" class="ptag shoptag" type="button" hidden><svg viewBox="0 0 120 60" aria-hidden="true"><use id="toShopArt" href="#art-hammer" /></svg><span data-t="toShop"></span></button>
      <p id="soon" class="soon" hidden></p>
      <div id="played" class="played" hidden></div>
    </section>
    <section id="job" class="screen" hidden>
      <div class="tape">
        <div class="who"><span id="who"></span><span id="tapeStars" class="tstars" hidden></span></div>
        <div class="nums">
          <span><span data-t="estimate"></span><b id="estimate"></b></span>
          <span><span data-t="spent"></span><b id="spent"></b></span>
          <span id="gain" class="profit"><span id="gainLabel"></span><b id="profit"></b></span>
        </div>
        <div class="ruler">
          <svg viewBox="0 0 100 17" preserveAspectRatio="none" aria-hidden="true">
            <g id="ticks"></g>
            <line id="bar" x1="3" y1="9" x2="3" y2="9" />
            <text id="rulerLabel" x="91" y="3.6" text-anchor="end"></text>
            <text id="overrun" y="15.6" text-anchor="end"></text>
          </svg>
        </div>
        <div class="done" id="done"></div>
      </div>
      <div class="note" id="note"><svg id="noteEye" class="eye" viewBox="0 0 24 14" aria-hidden="true" hidden><path d="M1.5 7 Q12 -2 22.5 7 Q12 16 1.5 7 Z" /><circle cx="12" cy="7" r="3.1" /><circle class="pupil" cx="12" cy="7" r="1.4" /></svg><span id="noteLine"></span></div>
      <div class="board"><canvas id="plan" role="img"></canvas><div id="draw" class="draw" hidden></div></div>
      <div id="caps" class="caps" role="toolbar" hidden>
        <button class="cap" type="button" aria-pressed="false" data-method="open"><svg viewBox="0 0 30 12" aria-hidden="true"><path class="cable open" d="M3 6h24" /></svg><span class="words"><span data-t="open"></span><small id="priceOpen"></small></span></button>
        <button class="cap" type="button" aria-pressed="false" data-method="channel"><svg viewBox="0 0 30 12" aria-hidden="true"><rect class="duct" x="1.5" y="2.4" width="27" height="7.2" rx="0.8" /><path class="cable" d="M4 6h22" /></svg><span class="words"><span data-t="channel"></span><small id="priceChannel"></small></span></button>
        <button class="cap" type="button" aria-pressed="false" data-method="chase" hidden><svg viewBox="0 0 30 12" aria-hidden="true"><rect class="plaster" x="1.5" y="1.6" width="27" height="8.8" /><path class="cable chased" d="M4 6h22" /></svg><span class="words"><span data-t="chase"></span><small id="priceChase"></small></span></button>
      </div>
      <div id="strip" class="strip" role="toolbar" hidden></div>
      <div class="controls">
        <div class="left">
          <button id="undo" class="disc" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5 4.5 11 9 15.5" /><path d="M5 11h9.5a5 5 0 0 1 0 10H11" /></svg></button>
          <button id="hint" class="disc hint" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="M13 7l4 4" /></svg></button>
        </div>
        <button id="finish" class="ptag finish" type="button" hidden><b data-t="finish"></b><small id="bill" hidden></small></button>
        <div class="zoom"><button id="zoomOut" class="disc" type="button">−</button><button id="zoomIn" class="disc" type="button">+</button></div>
      </div>
      <div id="ways" class="ways" hidden>
        <button class="ptag way" type="button" data-pay="client"><span class="wstars" id="clientStars"></span><span data-t="wayClient"></span><b id="clientMoney"></b></button>
        <button class="ptag way" type="button" data-pay="savings"><span class="wstars" id="savingsStars"></span><span data-t="waySavings"></span><b id="savingsMoney"></b></button>
      </div>
    </section>
    <section id="shop" class="screen shop" hidden>
      <p class="headline" data-t="shop"></p>
      <div class="savings"><span data-t="savings"></span><b id="shopSavings"></b></div>
      <div id="shopBought" class="kit" hidden></div>
      <div class="item">
        <svg class="tool" viewBox="0 0 120 60" aria-hidden="true"><use id="toolArt" href="#art-hammer" /></svg>
        <p id="toolName" class="name"></p>
        <svg id="does" class="does" viewBox="0 0 120 50" role="img" aria-label="A hole through a wall for the cable"><use id="doesArt" href="#art-hole" /></svg>
        <b id="price" class="price"></b>
        <div id="owned" class="stamp" data-t="bought" hidden></div>
      </div>
      <button id="buy" class="ptag big" type="button"></button>
      <p id="short" class="short" hidden></p>
      <button id="shopNext" class="ptag big" type="button" data-t="next" hidden></button>
      <div id="shopPlayed" class="played" hidden></div>
    </section>
    <button id="feature" class="feature" type="button" hidden>
      <span class="label">
        <svg data-feature="drill" viewBox="0 0 120 116" aria-hidden="true"><use href="#art-hammer" width="120" height="60" /><use href="#art-hole" y="66" width="120" height="50" /></svg>
        <svg data-feature="load" viewBox="0 0 132 64" aria-hidden="true"><use href="#art-load" /></svg>
        <svg data-feature="wish" viewBox="0 0 132 76" aria-hidden="true"><use href="#art-wish" /></svg>
        <svg data-feature="chase" viewBox="0 0 120 116" aria-hidden="true"><use href="#art-chaser" width="120" height="60" /><use href="#art-chase" y="66" width="120" height="50" /></svg>
        <svg data-feature="lights" viewBox="0 0 132 38" aria-hidden="true"><use href="#art-lights" /></svg>
      </span>
    </button>
    <div id="card" class="card" role="dialog" aria-labelledby="cardTitle" hidden>
      <p id="cardTitle" class="headline"></p>
      <div id="cardStars" class="stars"></div>
      <p id="review" class="review"><span id="reviewLine"></span><span id="reviewBy" class="by"></span></p>
      <div class="money" id="cardProfit"><span data-t="profit"></span><b id="cardProfitValue"></b></div>
      <div id="stamp" class="stamp" data-t="best" hidden></div>
      <div class="savings"><span data-t="savings"></span><b id="cardSavings"></b></div>
      <div id="cardPlayed" class="played" hidden></div>
      <div id="actions" class="actions">
        <button id="again" class="ptag" type="button" data-t="again"></button>
        <button id="next" class="ptag" type="button" data-t="next"></button>
        <button id="cardShop" class="ptag" type="button" data-t="toShop" hidden></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
